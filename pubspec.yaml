name: on_device_ai
description: "Offline chat with Gemma 4 E2B running on-device via LiteRT-LM."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_gemma: ^0.13.1
  # Already pulled in by flutter_gemma; used directly for the download
  # notification that keeps large downloads in a foreground service.
  background_downloader: ^9.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
